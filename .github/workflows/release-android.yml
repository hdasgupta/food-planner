name: Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Automatically increment application version
        id: version
        shell: bash
        run: |
          # GitHub increments run_number for every run of this workflow.
          # This produces a unique, monotonically increasing Android version.
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building Food Planner v$VERSION (versionCode $VERSION_CODE)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's ubuntu-latest runner already includes the Android SDK.
      # Avoid setup-android's package-install step; install packages explicitly
      # with retries so any SDK manager failure is visible in the job log.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android SDK package installation failed after 3 attempts"
              exit 1
            fi
            echo "SDK install attempt $attempt failed; retrying in 15 seconds..."
            sleep 15
          done
          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed
          echo "ANDROID_HOME=$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          java -version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build web frontend
        working-directory: frontend
        run: npm run build

      - name: Generate Capacitor Android project
        working-directory: frontend
        run: npx cap add android

      - name: Synchronize Capacitor assets
        working-directory: frontend
        run: npx cap sync android

      - name: Set Android app version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re, sys

          path = Path('frontend/android/app/build.gradle')
          if not path.exists():
              path = Path('frontend/android/app/build.gradle.kts')
          if not path.exists():
              sys.exit('Could not find generated Android app Gradle file')

          content = path.read_text()
          if path.suffix == '.kts':
              content, code_count = re.subn(r'versionCode\s*=\s*\d+', f"versionCode = {os.environ['APP_VERSION_CODE']}", content, count=1)
              content, name_count = re.subn(r'versionName\s*=\s*"[^"]*"', f"versionName = \"{os.environ['APP_VERSION']}\"", content, count=1)
          else:
              content, code_count = re.subn(r'versionCode\s+\d+', f"versionCode {os.environ['APP_VERSION_CODE']}", content, count=1)
              content, name_count = re.subn(r"versionName\s+['\"][^'\"]*['\"]", f"versionName '{os.environ['APP_VERSION']}'", content, count=1)
          if code_count != 1 or name_count != 1:
              sys.exit('Could not safely update versionCode/versionName in Gradle file')
          path.write_text(content)
          print(f'Set Android version to {os.environ["APP_VERSION"]} ({os.environ["APP_VERSION_CODE"]})')
          PY

      - name: Build APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare versioned APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "release-assets/food-planner-v${VERSION}.apk"
          sha256sum "release-assets/food-planner-v${VERSION}.apk" > "release-assets/food-planner-v${VERSION}.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Food Planner v${VERSION}" \
              --notes "Android APK release v${VERSION}. Download the APK below and install it on your Android device. This is a debug-signed APK intended for direct installation/testing." \
              --target "$GITHUB_SHA"
          fi
